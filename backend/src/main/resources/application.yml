server:
  port: 8080

spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: final-auth-backend
  datasource:
    url: jdbc:h2:mem:finalauth;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

app:
  jwt:
    secret: ${JWT_SECRET}
    access-token-expiration-minutes: 15
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
